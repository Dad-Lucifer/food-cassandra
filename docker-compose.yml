services:
  cassandra-node1:
    image: cassandra:4.1
    container_name: cassandra-node1
    hostname: cassandra-node1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=FoodDeliveryCluster
      - CASSANDRA_SEEDS=cassandra-node1
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=RACK1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra-node1-data:/var/lib/cassandra
    networks:
      - cassandra-net

  cassandra-node2:
    image: cassandra:4.1
    container_name: cassandra-node2
    hostname: cassandra-node2
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=FoodDeliveryCluster
      - CASSANDRA_SEEDS=cassandra-node1
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=RACK2
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra-node2-data:/var/lib/cassandra
    networks:
      - cassandra-net
    depends_on:
      - cassandra-node1

  cassandra-node3:
    image: cassandra:4.1
    container_name: cassandra-node3
    hostname: cassandra-node3
    ports:
      - "9044:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=FoodDeliveryCluster
      - CASSANDRA_SEEDS=cassandra-node1
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=RACK3
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra-node3-data:/var/lib/cassandra
    networks:
      - cassandra-net
    depends_on:
      - cassandra-node1

  backend:
    build: ./backend
    container_name: food-delivery-backend
    ports:
      - "5000:5000"
    networks:
      - cassandra-net
    depends_on:
      - cassandra-node1
      - cassandra-node2
      - cassandra-node3

networks:
  cassandra-net:
    driver: bridge

volumes:
  cassandra-node1-data:
  cassandra-node2-data:
  cassandra-node3-data: